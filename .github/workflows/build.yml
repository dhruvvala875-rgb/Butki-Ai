name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create dummy google-services.json
      run: |
        PACKAGE_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.rgb.butki")
        cat <<EOF > app/google-services.json
        {
          "project_info": { "project_number": "123456789012", "project_id": "dummy-project" },
          "client": [ {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                "android_client_info": { "package_name": "$PACKAGE_NAME" }
              },
              "api_key": [ {"current_key": "dummy-key"} ]
            } ],
          "configuration_version": "1"
        }
        EOF

    - name: Generate gradlew with specific version
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Butki-Ai
        path: app/build/outputs/apk/debug/app-debug.apk
        
